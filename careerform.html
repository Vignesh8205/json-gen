<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Opportunities Submission Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <h1>Career Opportunities Submission Form</h1>
        <p>We’re excited to learn more about you and your professional journey. This form is designed for individuals interested in joining our team.</p>

        <form action="#" method="post">
            <label for="name">Name*</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address*</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number*</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="position">Position Applied For*</label>
            <select id="position" name="position" required>
                <option value="java_trainer">Java Fullstack Trainer</option>
                <option value="python_trainer">Python Fullstack Trainer</option>
                <option value="mern_trainer">MERN Stack Trainer</option>
                <option value="software_testing">Software Testing</option>
                <option value="devops_trainer">DevOps Trainer</option>
                <option value="other">Other...</option>
            </select>

            <label for="resume">Upload Your Resume*</label>
            <input type="file" id="resume" name="resume" accept=".pdf" required>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
